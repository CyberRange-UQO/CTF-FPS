name: vanta-root-of-trust

services:
  root-of-trust:
    build:
      context: .
    ports:
      - "${ROOT_OF_TRUST_BIND:-127.0.0.1}:${ROOT_OF_TRUST_PORT:-8084}:8000"
    environment:
      ROOT_AUDIT_KEY_B64U: "${ROOT_AUDIT_KEY_B64U:?Provisionnez la cle ROOT-AUDIT partagee dans .env}"
      ATTESTATION_ED25519_SEED_B64U: "${ATTESTATION_ED25519_SEED_B64U:?Provisionnez la graine Ed25519 privee dans .env}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 1.0
    init: true
    restart: unless-stopped
    networks:
      - trust-isolated

networks:
  trust-isolated:
    driver: bridge
    # Published ports work on the laboratory's Docker 20.10. No runtime egress needed.
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "false"
