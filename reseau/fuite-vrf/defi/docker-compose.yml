name: ctf-fuite-vrf
services:
  pe:
    build: ./pe
    privileged: true
    sysctls: ["net.ipv4.ip_forward=1"]
    networks: {anet: {ipv4_address: 192.168.1.1}, bnet: {ipv4_address: 192.168.2.1}}
    cpus: "0.4"
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped
  cea:
    build: ./cea
    cap_add: [NET_ADMIN]
    ports: ["1347:22"]
    networks: {anet: {ipv4_address: 192.168.1.2}, mgmt: {}}
    cpus: "0.3"
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
  ceb:
    build: ./ceb
    cap_add: [NET_ADMIN]
    networks: {bnet: {ipv4_address: 192.168.2.2}}
    cpus: "0.2"
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
networks:
  anet: {internal: true, ipam: {config: [{subnet: 192.168.1.0/24, gateway: 192.168.1.254}]}}
  bnet: {internal: true, ipam: {config: [{subnet: 192.168.2.0/24, gateway: 192.168.2.254}]}}
  mgmt: {}
