description: |
  Les traces documentaires de MIRA-07 ont conduit STATIC jusqu'à BLACK VAULT,
  le service de conservation classifié de VANTA à Noctis-9. Les registres
  d'identité peuvent changer ; les obligations de conservation demeurent.
  La référence transmise par MIRROR GATE doit encore exister dans cet index.

  STATIC dispose d'un poste archiviste. Retrouvez le dossier, examinez
  ses pièces et obtenez une attestation de contact auprès du service de
  diagnostic. Conservez les matériaux d'audit utiles à la suite de l'enquête.

  **Compte archiviste :** `archivist.bv-021`
  **Mot de passe :** `BV-021-2147`
  Rôle : ARCHIVE_OPERATOR · Habilitation : ARCHIVE-1.

  Ouvrez `/login` sur l'instance fournie par l'organisation.
  Toutes les identités présentées sont fictives.
