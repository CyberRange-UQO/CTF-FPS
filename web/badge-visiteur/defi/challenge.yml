name: badge-visiteur
author: Herastique - Rémi Pantzer
category: Web
description: |
  A l'accueil de Corp, un badge visiteur numerique vous est attribue
  automatiquement. L'espace d'administration, lui, est reserve au personnel.

  Saurez-vous y acceder quand meme ?

  Acces : `http://192.168.10.100:1342`.

  Le flag est au format `FPS{...}`.
