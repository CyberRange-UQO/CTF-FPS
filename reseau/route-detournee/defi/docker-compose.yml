name: ctf-route-detournee

x-rtr: &rtr
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls: ["net.ipv4.ip_forward=1"]
  cpus: "0.3"
  mem_limit: 256m
  pids_limit: 256
  restart: unless-stopped

services:
  transit:
    <<: *rtr
    build: ./transit
    networks:
      tv: {ipv4_address: 10.0.1.1}
      tc: {ipv4_address: 10.0.2.1}
      ta: {ipv4_address: 10.0.3.1}

  victime:
    <<: *rtr
    build: ./victime
    networks:
      tv: {ipv4_address: 10.0.1.2}
      side: {ipv4_address: 172.16.0.1}

  client:
    <<: *rtr
    build: ./client
    networks:
      tc: {ipv4_address: 10.0.2.2}

  attaquant:
    <<: *rtr
    build: ./attaquant
    ports:
      - "1345:22"
    networks:
      ta: {ipv4_address: 10.0.3.2}
      side: {ipv4_address: 172.16.0.2}
      mgmt: {}

networks:
  tv:   {internal: true, ipam: {config: [{subnet: 10.0.1.0/24, gateway: 10.0.1.254}]}}
  tc:   {internal: true, ipam: {config: [{subnet: 10.0.2.0/24, gateway: 10.0.2.254}]}}
  ta:   {internal: true, ipam: {config: [{subnet: 10.0.3.0/24, gateway: 10.0.3.254}]}}
  side: {internal: true, ipam: {config: [{subnet: 172.16.0.0/24, gateway: 172.16.0.254}]}}
  mgmt: {}
