frr defaults traditional
hostname PE2
!
interface lo
 ip address 10.0.0.3/32
interface core
 ip address 10.1.23.3/24
interface cust
 ip address 192.168.22.1/24
!
router ospf
 network 10.0.0.3/32 area 0
 network 10.1.23.0/24 area 0
!
router bgp 65000
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
 exit-address-family
!
router bgp 65000 vrf CLIENTC
 address-family ipv4 unicast
  redistribute connected
  label vpn export 1000
  rd vpn export 65000:300
  rt vpn both 65000:300
  export vpn
  import vpn
 exit-address-family
!
line vty
