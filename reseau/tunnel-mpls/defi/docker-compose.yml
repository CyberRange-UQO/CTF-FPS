name: ctf-tunnel-mpls
x-r: &r
  build: {context: ., dockerfile: router.Dockerfile}
  privileged: true
  sysctls: ["net.ipv4.ip_forward=1"]
  cpus: "0.4"
  mem_limit: 256m
  pids_limit: 256
  restart: unless-stopped
services:
  pe1:
    <<: *r
    command: ["pe1"]
    volumes: [./pe1/frr.conf:/frr.conf:ro, ./pe1/ldp.conf:/ldp.conf:ro]
    networks: {l12: {ipv4_address: 10.1.12.1}, c1net: {ipv4_address: 192.168.11.1}}
  p:
    <<: *r
    command: ["p"]
    volumes: [./p/frr.conf:/frr.conf:ro, ./p/ldp.conf:/ldp.conf:ro]
    networks: {l12: {ipv4_address: 10.1.12.2}, l23: {ipv4_address: 10.1.23.2}}
  pe2:
    <<: *r
    command: ["pe2"]
    volumes: [./pe2/frr.conf:/frr.conf:ro, ./pe2/ldp.conf:/ldp.conf:ro]
    networks: {l23: {ipv4_address: 10.1.23.3}, c2net: {ipv4_address: 192.168.22.1}}
  cec1:
    build: ./cec1
    cap_add: [NET_ADMIN]
    networks: {c1net: {ipv4_address: 192.168.11.2}}
    cpus: "0.2"
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
  cec2:
    build: ./cec2
    cap_add: [NET_ADMIN]
    networks: {c2net: {ipv4_address: 192.168.22.2}}
    cpus: "0.2"
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
  attaquant:
    build: ./attaquant
    cap_add: [NET_ADMIN, NET_RAW]
    ports: ["1346:22"]
    networks: {l23: {ipv4_address: 10.1.23.50}, mgmt: {}}
    cpus: "0.4"
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
networks:
  l12:   {internal: true, ipam: {config: [{subnet: 10.1.12.0/24, gateway: 10.1.12.254}]}}
  l23:   {internal: true, ipam: {config: [{subnet: 10.1.23.0/24, gateway: 10.1.23.254}]}}
  c1net: {internal: true, ipam: {config: [{subnet: 192.168.11.0/24, gateway: 192.168.11.254}]}}
  c2net: {internal: true, ipam: {config: [{subnet: 192.168.22.0/24, gateway: 192.168.22.254}]}}
  mgmt:  {}
