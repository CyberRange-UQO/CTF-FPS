name: OpenSesame (2/3)
author: Zlippy
category: forensic

description: |
  Le programme suspect ayant été identifié, une nouvelle question se pose : depuis combien de temps est-il présent sur la machine, et surtout, a-t-il réellement été exécuté ?

  L'analyse doit maintenant permettre de retracer son activité sur le poste du diplomate. Déterminez **combien de fois le programme a été exécuté ainsi que la date et l'heure de sa dernière exécution**.

  Flag attendu sous le format suivant : FPS{Nmbre_d'execution:annee-mois-jour:heure:minute:seconde}
  
  Exemple : FPS{1;2024-12-31:10:59:59}

type: dynamic
extra:
  initial: 500
  decay: 20        
  minimum: 100
  function: logarithmic 

flags:
  - FPS{3;2026-10-04:14:47:45}

tags:
  - Moyen

connection_info: ""
requirements:
  prerequisites:
    - "OpenSesame (1/3)"
  behavior: "hidden" 

state: hidden
